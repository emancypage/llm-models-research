version = 1

# REUSE uses the last matching annotation in this file. AND expressions identify
# different contributions to the same file. Each FileComment gives their scope.
# The root LICENSE and LICENSES/ contain the publishers' legal texts and are
# exempt from REUSE annotation. The filename in LICENSES/ identifies each text.

[[annotations]]
path = ["experiments/**", "requirements-replay.txt", ".gitignore", "REUSE.toml"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Szymon Szymkowiak"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The UD Polish-LFG trials contain identifiers and tense labels. The two Polish
# Belebele result files contain predictions and correctness flags. Their source
# sentences, passages, questions and answer choices are fetched separately.
# These files, and the MMLU, ARC and IFEval score files, keep the content default.
[[annotations]]
path = ["reports/**", "session-logs/**", "README.md", "AGENTS.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Szymon Szymkowiak"
SPDX-License-Identifier = "CC-BY-SA-4.0"

